# Server Configuration
server.port=8080
server.servlet.context-path=

# Application Name
spring.application.name=green-route-planner

# Database Configuration (PostgreSQL by default with H2 fallback for standalone demo mode)
# If DB_URL environment variable is provided, Spring Boot connects to PostgreSQL
# Otherwise, it falls back to an embedded in-memory H2 database with demo data!
spring.datasource.url=${DB_URL:jdbc:h2:mem:greenroutedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate Settings
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development & demo verification at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# External Service Configurations
# OpenWeather API Key (optional: falls back to realistic environmental meteorological modeling)
weather.api.key=${OPENWEATHER_API_KEY:}
weather.api.base-url=https://api.openweathermap.org/data/2.5

# OSRM Public Routing API
routing.osrm.car-url=https://router.project-osrm.org/route/v1/driving
routing.osrm.bike-url=https://routing.openstreetmap.de/routed-bike/route/v1/driving
routing.osrm.foot-url=https://routing.openstreetmap.de/routed-foot/route/v1/driving

# Overpass API for EV Charging Stations
osm.overpass.url=https://overpass-api.de/api/interpreter

# Configurable Emission Factors (Grams CO2 per passenger-kilometer)
greenroute.emissions.car-petrol=171.0
greenroute.emissions.car-diesel=171.0
greenroute.emissions.car-hybrid=103.0
greenroute.emissions.ev=47.0
greenroute.emissions.public-transit=68.0
greenroute.emissions.bicycle=0.0
greenroute.emissions.walking=0.0

# Baseline comparison vehicle (Standard ICE petrol car for calculating savings)
greenroute.emissions.baseline-factor=171.0

# CORS Allowed Origins
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
